<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#bg)" />
  <rect x="15" y="15" width="1070" height="620" rx="10" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect x="200" y="25" width="700" height="50" rx="8" fill="url(#green)" />
  <text x="550" y="57" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CREATIONAL DESIGN PATTERNS: OBJECT INSTANTIATION</text>

  <!-- Pattern 1: Singleton -->
  <g transform="translate(40, 95)">
    <rect width="480" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="480" height="32" rx="8" fill="#0f172a" />
    <text x="15" y="22" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">1. SINGLETON PATTERN</text>
    <text x="15" y="55" fill="#f8fafc" font-size="12" font-family="monospace">class SingletonMeta(type):</text>
    <text x="35" y="75" fill="#94a3b8" font-size="12" font-family="monospace">_instances, _lock = {}, threading.Lock()</text>
    <text x="35" y="95" fill="#38bdf8" font-size="12" font-family="monospace">with _lock: if cls not in _instances: create()</text>
    <rect x="340" y="45" width="125" height="90" rx="6" fill="#0b0f19" stroke="#334155" />
    <text x="402" y="70" fill="#34d399" font-size="11" text-anchor="middle">Thread-Safe</text>
    <text x="402" y="92" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">[ 1 INSTANCE ]</text>
    <text x="402" y="115" fill="#94a3b8" font-size="10" text-anchor="middle">Global Access</text>
  </g>

  <!-- Pattern 2: Factory Method -->
  <g transform="translate(560, 95)">
    <rect width="480" height="150" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="0" y="0" width="480" height="32" rx="8" fill="#0f172a" />
    <text x="15" y="22" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">2. FACTORY METHOD PATTERN</text>
    <text x="15" y="55" fill="#f8fafc" font-size="12" font-family="monospace">class Logistics(ABC):</text>
    <text x="35" y="75" fill="#38bdf8" font-size="12" font-family="monospace">@abstractmethod create_transport() -> Transport</text>
    <text x="35" y="95" fill="#94a3b8" font-size="12" font-family="monospace">def plan_delivery(): transport.deliver()</text>
    <rect x="330" y="45" width="135" height="90" rx="6" fill="#0b0f19" stroke="#334155" />
    <text x="397" y="72" fill="#38bdf8" font-size="11" text-anchor="middle">Road -> Truck</text>
    <text x="397" y="92" fill="#a78bfa" font-size="11" text-anchor="middle">Sea -> Ship</text>
    <text x="397" y="112" fill="#34d399" font-size="11" text-anchor="middle">Air -> Plane</text>
  </g>

  <!-- Pattern 3: Abstract Factory -->
  <g transform="translate(40, 265)">
    <rect width="480" height="160" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="0" y="0" width="480" height="32" rx="8" fill="#0f172a" />
    <text x="15" y="22" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">3. ABSTRACT FACTORY PATTERN</text>
    <text x="15" y="55" fill="#f8fafc" font-size="12" font-family="monospace">class UIFactory(Protocol):</text>
    <text x="35" y="75" fill="#94a3b8" font-size="12" font-family="monospace">create_button() -> Button</text>
    <text x="35" y="95" fill="#94a3b8" font-size="12" font-family="monospace">create_checkbox() -> Checkbox</text>
    <text x="15" y="125" fill="#34d399" font-size="11">Families: DarkUIFactory -> (DarkBtn, DarkCheck)</text>
    <text x="15" y="145" fill="#38bdf8" font-size="11">Families: LightUIFactory -> (LightBtn, LightCheck)</text>
    <rect x="330" y="45" width="135" height="100" rx="6" fill="#0b0f19" stroke="#334155" />
    <text x="397" y="75" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">Coordinated</text>
    <text x="397" y="95" fill="#f8fafc" font-size="11" text-anchor="middle">Product Family</text>
    <text x="397" y="115" fill="#94a3b8" font-size="10" text-anchor="middle">No cross-theme</text>
    <text x="397" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">mismatches</text>
  </g>

  <!-- Pattern 4: Builder -->
  <g transform="translate(560, 265)">
    <rect width="480" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="480" height="32" rx="8" fill="#0f172a" />
    <text x="15" y="22" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">4. BUILDER PATTERN (FLUENT)</text>
    <text x="15" y="55" fill="#f8fafc" font-size="12" font-family="monospace">req = (HttpRequest.builder(url)</text>
    <text x="45" y="75" fill="#fbbf24" font-size="12" font-family="monospace">.method("POST")</text>
    <text x="45" y="95" fill="#fbbf24" font-size="12" font-family="monospace">.header("Auth", token)</text>
    <text x="45" y="115" fill="#fbbf24" font-size="12" font-family="monospace">.timeout(10).build())</text>
    <rect x="330" y="45" width="135" height="100" rx="6" fill="#0b0f19" stroke="#334155" />
    <text x="397" y="75" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Step-by-Step</text>
    <text x="397" y="95" fill="#f8fafc" font-size="11" text-anchor="middle">Fluent Chaining</text>
    <text x="397" y="115" fill="#34d399" font-size="10" text-anchor="middle">Immutable Object</text>
    <text x="397" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">Validation Gate</text>
  </g>

  <!-- Pattern 5: Prototype -->
  <g transform="translate(300, 445)">
    <rect width="500" height="170" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="500" height="32" rx="8" fill="#1e293b" />
    <text x="15" y="22" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">5. PROTOTYPE PATTERN (DEEP CLONING)</text>
    <text x="15" y="55" fill="#f8fafc" font-size="12" font-family="monospace">import copy</text>
    <text x="15" y="75" fill="#f8fafc" font-size="12" font-family="monospace">def clone(self, **overrides) -> Self:</text>
    <text x="35" y="95" fill="#f472b6" font-size="12" font-family="monospace">cloned = copy.deepcopy(self)</text>
    <text x="35" y="115" fill="#94a3b8" font-size="12" font-family="monospace">for k, v in overrides.items(): setattr(cloned, k, v)</text>
    <text x="15" y="145" fill="#94a3b8" font-size="11">Use case: Rapidly branch 50MB simulation meshes &amp; snapshot trees without DB query.</text>
  </g>
</svg>
