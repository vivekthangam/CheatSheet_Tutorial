<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="distBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#distBg)" />
  <rect x="15" y="15" width="1170" height="670" rx="12" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect x="250" y="25" width="700" height="50" rx="8" fill="url(#cyanBlue)" />
  <text x="600" y="57" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FAANG-TIER ENTERPRISE DISTRIBUTED SYSTEM ARCHITECTURE</text>

  <!-- Flow Levels -->
  <!-- Level 1: Clients & DNS/CDN -->
  <g transform="translate(60, 95)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="110" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">GLOBAL CLIENTS</text>
    <text x="110" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">Mobile Apps, Web, IoT</text>
  </g>

  <line x1="280" y1="135" x2="360" y2="135" stroke="#38bdf8" stroke-width="2" />

  <g transform="translate(360, 95)">
    <rect width="240" height="80" rx="8" fill="#1e293b" stroke="#34d399" />
    <text x="120" y="35" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">ANYCAST DNS + CDN</text>
    <text x="120" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">Cloudflare / CloudFront (Edge)</text>
  </g>

  <line x1="600" y1="135" x2="680" y2="135" stroke="#34d399" stroke-width="2" />

  <g transform="translate(680, 95)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" />
    <text x="110" y="35" fill="#a78bfa" font-size="14" font-weight="bold" text-anchor="middle">LAYER 4 LOAD BALANCER</text>
    <text x="110" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">Maglev / IPVS (TCP Syn Proxy)</text>
  </g>

  <line x1="900" y1="135" x2="980" y2="135" stroke="#a78bfa" stroke-width="2" />

  <g transform="translate(980, 95)">
    <rect width="160" height="80" rx="8" fill="#1e293b" stroke="#f472b6" />
    <text x="80" y="35" fill="#f472b6" font-size="13" font-weight="bold" text-anchor="middle">LAYER 7 GATEWAY</text>
    <text x="80" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">Envoy / Kong (Auth)</text>
  </g>

  <!-- Vertical Connection from L7 to Microservices -->
  <line x1="1060" y1="175" x2="1060" y2="225" stroke="#cbd5e1" stroke-width="2" />
  <line x1="1060" y1="225" x2="600" y2="225" stroke="#cbd5e1" stroke-width="2" />
  <line x1="600" y1="225" x2="600" y2="250" stroke="#cbd5e1" stroke-width="2" />

  <!-- Level 2: Microservices Layer -->
  <g transform="translate(60, 250)">
    <rect width="1080" height="110" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="540" y="28" fill="#a5b4fc" font-size="14" font-weight="bold" text-anchor="middle">STATELESS PYTHON MICROSERVICES CLUSTER (FASTAPI / ASGI + GUNICORN UVICORN)</text>

    <!-- Service pods -->
    <rect x="30" y="45" width="220" height="50" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="140" y="75" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Auth &amp; Session Service</text>

    <rect x="290" y="45" width="220" height="50" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="400" y="75" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Order &amp; Checkout Service</text>

    <rect x="550" y="45" width="220" height="50" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="660" y="75" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Catalog &amp; Search Service</text>

    <rect x="810" y="45" width="240" height="50" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="930" y="75" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Payment &amp; Wallet Service</text>
  </g>

  <!-- Level 3: Distributed Caching & Event Streaming -->
  <g transform="translate(60, 395)">
    <!-- Cache -->
    <rect width="520" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="260" y="30" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">DISTRIBUTED CACHE LAYER (REDIS CLUSTER / MEMCACHED)</text>
    <text x="260" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Consistent Hashing with Virtual Nodes (16,384 Slots)</text>
    <text x="260" y="78" fill="#cbd5e1" font-size="11" text-anchor="middle">Cache-Aside (Lazy Load) + Write-Through Topologies</text>
    <text x="260" y="100" fill="#34d399" font-size="11" text-anchor="middle">Sub-Millisecond Read Latency (P99 &lt; 2ms)</text>

    <!-- Message Queue -->
    <g transform="translate(560, 0)">
      <rect width="520" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="260" y="30" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">EVENT STREAMING &amp; MESSAGE BROKER (APACHE KAFKA)</text>
      <text x="260" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Append-Only Commit Log partitioned by Entity Key</text>
      <text x="260" y="78" fill="#cbd5e1" font-size="11" text-anchor="middle">Consumer Groups with At-Least-Once / Exactly-Once Semantics</text>
      <text x="260" y="100" fill="#38bdf8" font-size="11" text-anchor="middle">Async Decoupling &amp; Peak Load Leveling (Backpressure)</text>
    </g>
  </g>

  <!-- Level 4: Persistence Tier -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="115" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />
    <text x="540" y="28" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">PERSISTENCE TIER: POLYGLOT STORAGE ARCHITECTURE</text>

    <rect x="25" y="45" width="320" height="55" rx="6" fill="#1e293b" />
    <text x="185" y="68" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Sharded PostgreSQL (ACID)</text>
    <text x="185" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">Financial Ledgers, User Accounts</text>

    <rect x="380" y="45" width="320" height="55" rx="6" fill="#1e293b" />
    <text x="540" y="68" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Cassandra / ScyllaDB (Wide-Column)</text>
    <text x="540" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">High-Write Telemetry, Time-Series</text>

    <rect x="735" y="45" width="320" height="55" rx="6" fill="#1e293b" />
    <text x="895" y="68" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Amazon S3 / MinIO (Blob Store)</text>
    <text x="895" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">Raw Media, Document Snapshots, Backups</text>
  </g>
</svg>
