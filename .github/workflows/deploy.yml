name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # Change to 'master' if your default branch is master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uncomment below if you use pnpm instead of npm
      # - uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # or pnpm

      - name: Install dependencies
        run: npm ci # Use 'pnpm install' if using pnpm

      - name: Build with VitePress
        run: npm run docs:build # Generates output in .vitepress/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4